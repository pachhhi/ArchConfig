;====================================================
;           POLYBAR - CYBERIACAFE
;====================================================

[colors]
background = #0D0D0D
foreground = #a0ff00
foreground-alt = #6ad6ff
disabled = #555555
alert = #ff0033

tag = #6ad6ff
tag-text = #ffffff
purple = #5B4B8A

[bar/main]
width = 100%
height = 30pt
radius = 0
fixed-center = true

border-size = 2
border-color = ${colors.foreground-alt}

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0

padding-left = 0
padding-right = 1
module-margin = 2

separator = "│"
separator-foreground = ${colors.purple}

font-0 = "JetBrainsMono Nerd Font:size=11;4"
font-1 = "Symbols Nerd Font Mono:size=12;3"
font-2 = "JetBrainsMono Nerd Font:size=9;5"

modules-left = bspwm
modules-center = loadbar title
modules-right = network pulseaudio date powermenu

cursor-click = pointer
enable-ipc = true
wm-restack = bspwm

;----------------------------------------------------
; Workspaces
; NOTE: rename your bspwm desktops so %name% already
; shows "1: term", "2: web", "3: code", "4: chat", "5: sys"
;   bspc monitor -d "1: term" "2: web" "3: code" "4: chat" "5: sys"
;----------------------------------------------------
[module/bspwm]
type = internal/bspwm

format = <label-state>

label-focused = %name%
label-focused-background = ${colors.purple}
label-focused-foreground = ${colors.tag-text}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = #ffffff
label-urgent-padding = 2

;----------------------------------------------------
; Decorative loading/progress bar next to the title
;----------------------------------------------------
[module/loadbar]
type = custom/text
content = "%{F#5B4B8A}▰▰▰▰▰▰%{F#6ad6ff}▰▰%{F#555555}▱▱▱▱▱▱▱▱▱▱▱▱%{F-}"
content-foreground = ${colors.purple}
content-background = ${colors.background}

[module/title]
type = custom/text
content = "%{T2}%{F#a0ff00}CyberiaCafe%{F-}%{T-} %{F#6ad6ff}-%{F-} // RESEARCHING. BUILDING. BREAKING LIMITS."
content-foreground = ${colors.foreground-alt}
content-background = ${colors.background}

;----------------------------------------------------
; Network - shows local IP with icon
; NOTE: change "interface" to your actual device name
; (check with: ip link, e.g. wlan0 / enp3s0)
;----------------------------------------------------
[module/network]
type = internal/network
interface = ${env:POLYBAR_NETWORK_INTERFACE:lo}
interval = 3.0

format-connected = <label-connected>
label-connected = %{T2}%{F#6ad6ff}%{F-}%{T-} %local_ip%
label-connected-foreground = ${colors.foreground-alt}

format-disconnected = <label-disconnected>
label-disconnected = %{T2}%{F#555555}%{F-}%{T-} disconnected
label-disconnected-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume = %{T2}%{F#6ad6ff}%{F-}%{T-} %{F#a0ff00}%percentage%%%{F-}

format-muted = <label-muted>
label-muted = %{T2}%{F#555555}%{F-}%{T-} %{F#555555}MUTED%{F-}

[module/date]
type = internal/date
interval = 1
date = %d %b %H:%M
date-alt = %Y-%m-%d %H:%M
label = %{F#6ad6ff}%date%%{F-}

;----------------------------------------------------
; Power menu - click to open your power menu / poweroff
; NOTE: swap the exec command for whatever you use
; (rofi powermenu script, systemctl, etc.)
;----------------------------------------------------
[module/powermenu]
type = custom/text
content = "%{T2}%{F#ff0033}%{F-}%{T-}"
click-left = rofi -show powermenu -modi powermenu:~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false
