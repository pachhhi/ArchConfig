backend = "glx";
vsync = true;

use-damage = true;

xrender-sync-fence = true;

blur-method = "none";
shadow = true;

blur-background-exclude = [
  "class_g = 'spectacle'",
  "class_g = 'maim'",
  "class_g = 'xclip'"
];

shadow-exclude = [
	"class_g = 'Alacritty'",
];

fade-exclude = [
	"class_g = 'Alacritty'",
];


corner-radius = 0;
#round-borders = 1;

shadow-radius = 12;
shadow-opacity = 0.35;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
	"85:class_g = 'zen'",
	"60:class_g = 'code'",
	"100:class_g = 'kitty'",
];
